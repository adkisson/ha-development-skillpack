alias: Automation – Post-Restart Recovery Gates
description: >
  Two-tier post-restart recovery: critical paths (security, safety) execute within 7 seconds; non-critical sensor/directive updates stagger across 45–75 seconds to avoid thundering-herd load spikes. Demonstrates trigger-level `for:` (no action delays) and branching via trigger IDs. Resilience: randomized non-critical delay flattens startup load; critical paths prioritize perimeter/life-safety.

  **Requires: the canonical startup-delay timer must be defined and started by your HA startup infrastructure.**

  **CHANGELOG:**

  - 20260607-1200: Replaced invalid elif chain with choose; startup trigger ID branches are provably mutually exclusive. Changed mode to parallel/max 2 to prevent silent drop of non-critical branch. Removed commented-out max_exceeded line.

  - 20260102-1620: Canonicalized example. Uses trigger-level `for:` only (no action delays), randomized non-critical stagger to prevent thundering herd, and explicit critical vs non-critical recovery paths.

  - 20251022-1100: Introduced split recovery gates: critical (7s fixed) vs non-critical (45–75s randomized) using trigger-level `for:`.

  - 20251018-1200: Initial sample.

mode: parallel
max: 2
max_exceeded: silent

triggers:
  - alias: HA startup – critical paths (7s gate)
    id: startup_critical
    trigger: state
    entity_id: timer.ha_startup_delay
    from: active
    to: idle
    for:
      seconds: 7

  - alias: HA startup – non-critical staggered (45–75s random)
    id: startup_noncritical
    trigger: state
    entity_id: timer.ha_startup_delay
    from: active
    to: idle
    for:
      seconds: "{{ range(45, 76) | random }}"

actions:
  - alias: Run the appropriate recovery path
    choose:
      - alias: Startup critical fired
        conditions:
          - condition: trigger
            id: startup_critical
        sequence:
          - alias: Secure perimeter – prime alarm state
            action: script.turn_on
            target:
              entity_id: script.security_prime_alarm_state

          - alias: Enable life-safety monitors
            action: script.turn_on
            target:
              entity_id: script.safety_enable_smoke_watch

      - alias: Startup non-critical fired
        conditions:
          - condition: trigger
            id: startup_noncritical
        sequence:
          - alias: Refresh energy and lighting directives
            action: homeassistant.update_entity
            target:
              entity_id:
                - sensor.energy_dispatch_directive
                - sensor.lighting_targets
